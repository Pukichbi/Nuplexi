name: Universal Android APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          mkdir -p unzipped
          unzip -o "*.zip" -d unzipped

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-find project and Build APK
        run: |
          # Автоматически ищем папку, где лежит settings.gradle или settings.gradle.kts
          SETTINGS_FILE=$(find unzipped -name "settings.gradle*" | head -n 1)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Ошибка: Не найден файл настройки Gradle в архиве!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Проект найден в папке: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Если gradlew нет, генерируем wrapper или используем системный gradle
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK Artifact 2
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/**/*.apk'
